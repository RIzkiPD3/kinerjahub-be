<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinerjaHub API Tester</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .api-url {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 30px;
      font-family: monospace;
      font-size: 14px;
    }
    .api-url input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: monospace;
      font-size: 14px;
    }
    .section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    h2 {
      color: #667eea;
      margin-bottom: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .response {
      margin-top: 15px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 6px;
      border-left: 4px solid #667eea;
      display: none;
    }
    .response.show {
      display: block;
    }
    .response pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    .success {
      border-left-color: #10b981;
    }
    .error {
      border-left-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 KinerjaHub API Tester</h1>
    <div class="api-url">
      <label>API Base URL:</label>
      <input type="text" id="apiUrl" value="https://your-app.railway.app" placeholder="https://your-app.railway.app">
    </div>

    <!-- Health Check -->
    <div class="section">
      <h2>🏥 Health Check</h2>
      <button onclick="testHealth()">Test Health</button>
      <div id="healthResponse" class="response"></div>
    </div>

    <!-- Register -->
    <div class="section">
      <h2>📝 Register</h2>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="regEmail" value="user@example.com">
      </div>
      <div class="form-group">
        <label>Name:</label>
        <input type="text" id="regName" value="John Doe">
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="regPassword" value="password123">
      </div>
      <div class="form-group">
        <label>Organization Name:</label>
        <input type="text" id="regOrgName" value="Example Corp">
      </div>
      <div class="form-group">
        <label>Organization Address:</label>
        <input type="text" id="regOrgAddress" value="123 Main St, Jakarta">
      </div>
      <div class="form-group">
        <label>Organization Phone:</label>
        <input type="text" id="regOrgPhone" value="+62 812-3456-7890">
      </div>
      <button onclick="testRegister()">Register</button>
      <div id="registerResponse" class="response"></div>
    </div>

    <!-- Login -->
    <div class="section">
      <h2>🔐 Login</h2>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="loginEmail" value="user@example.com">
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="loginPassword" value="password123">
      </div>
      <button onclick="testLogin()">Login</button>
      <div id="loginResponse" class="response"></div>
    </div>

    <!-- cURL Examples -->
    <div class="section">
      <h2>💻 cURL Examples</h2>
      <h3>Health Check:</h3>
      <textarea rows="2" readonly>curl https://your-app.railway.app/health</textarea>
      
      <h3 style="margin-top: 15px;">Register:</h3>
      <textarea rows="10" readonly>curl -X POST https://your-app.railway.app/api/auth/register \
  -H "Content-Type: application/json" \
  -d '{
    "email": "user@example.com",
    "name": "John Doe",
    "password": "password123",
    "organization_name": "Example Corp",
    "organization_address": "123 Main St, Jakarta",
    "organization_phone": "+62 812-3456-7890"
  }'</textarea>

      <h3 style="margin-top: 15px;">Login:</h3>
      <textarea rows="6" readonly>curl -X POST https://your-app.railway.app/api/auth/login \
  -H "Content-Type: application/json" \
  -d '{
    "email": "user@example.com",
    "password": "password123"
  }'</textarea>
    </div>
  </div>

  <script>
    function getApiUrl() {
      return document.getElementById('apiUrl').value.replace(/\/$/, '');
    }

    function showResponse(elementId, data, isError = false) {
      const el = document.getElementById(elementId);
      el.className = 'response show ' + (isError ? 'error' : 'success');
      el.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    }

    async function testHealth() {
      try {
        const response = await fetch(`${getApiUrl()}/health`);
        const data = await response.json();
        showResponse('healthResponse', data, !response.ok);
      } catch (error) {
        showResponse('healthResponse', { error: error.message }, true);
      }
    }

    async function testRegister() {
      try {
        const payload = {
          email: document.getElementById('regEmail').value,
          name: document.getElementById('regName').value,
          password: document.getElementById('regPassword').value,
          organization_name: document.getElementById('regOrgName').value,
          organization_address: document.getElementById('regOrgAddress').value,
          organization_phone: document.getElementById('regOrgPhone').value,
        };

        const response = await fetch(`${getApiUrl()}/api/auth/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        showResponse('registerResponse', data, !response.ok);
      } catch (error) {
        showResponse('registerResponse', { error: error.message }, true);
      }
    }

    async function testLogin() {
      try {
        const payload = {
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        };

        const response = await fetch(`${getApiUrl()}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        const data = await response.json();
        showResponse('loginResponse', data, !response.ok);
      } catch (error) {
        showResponse('loginResponse', { error: error.message }, true);
      }
    }

    // Example using axios (uncomment if you include axios)
    /*
    async function testLoginWithAxios() {
      try {
        const response = await axios.post(`${getApiUrl()}/api/auth/login`, {
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        });
        showResponse('loginResponse', response.data, false);
      } catch (error) {
        showResponse('loginResponse', error.response?.data || { error: error.message }, true);
      }
    }
    */
  </script>
</body>
</html>
